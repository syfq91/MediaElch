[workspace]
resolver = "2"
members = [
    "crates/mediaelch-core",
    "crates/mediaelch-db",
    "crates/mediaelch-fs",
    "crates/mediaelch-nfo",
    "crates/mediaelch-scrape",
    "crates/mediaelch-image",
    "crates/mediaelch-renamer",
    "crates/mediaelch-export",
    "crates/mediaelch-web",
    "crates/mediaelch-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
repository = "https://github.com/Komet/MediaElch"
rust-version = "1.85"

# Entries are added as the corresponding phase starts using them.
[workspace.dependencies]
mediaelch-core = { path = "crates/mediaelch-core" }
mediaelch-db = { path = "crates/mediaelch-db" }
mediaelch-export = { path = "crates/mediaelch-export" }
mediaelch-renamer = { path = "crates/mediaelch-renamer" }
mediaelch-scrape = { path = "crates/mediaelch-scrape" }
mediaelch-fs = { path = "crates/mediaelch-fs" }
mediaelch-image = { path = "crates/mediaelch-image" }
mediaelch-nfo = { path = "crates/mediaelch-nfo" }
mediaelch-web = { path = "crates/mediaelch-web" }
regex = "1"
roxmltree = "0.20"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
askama = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
futures-core = "0.3"
urlencoding = "2"
image = "0.25"
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
