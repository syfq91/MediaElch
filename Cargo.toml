[workspace]
resolver = "2"
members = [
    "crates/mediaelch-core",
    "crates/mediaelch-db",
    "crates/mediaelch-fs",
    "crates/mediaelch-nfo",
    "crates/mediaelch-scrape",
    "crates/mediaelch-image",
    "crates/mediaelch-renamer",
    "crates/mediaelch-export",
    "crates/mediaelch-web",
    "crates/mediaelch-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
repository = "https://github.com/Komet/MediaElch"
rust-version = "1.85"

# Entries are added as the corresponding phase starts using them.
[workspace.dependencies]
mediaelch-core = { path = "crates/mediaelch-core" }
mediaelch-db = { path = "crates/mediaelch-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
